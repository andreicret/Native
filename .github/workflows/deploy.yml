name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN || secrets.PUBLIC_POSTHOG_PROJECT_TOKEN }}
      PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST || secrets.PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate PostHog configuration
        if: ${{ env.PUBLIC_POSTHOG_PROJECT_TOKEN == '' || env.PUBLIC_POSTHOG_HOST == '' }}
        run: |
          echo "::error::Set PUBLIC_POSTHOG_PROJECT_TOKEN and PUBLIC_POSTHOG_HOST in repository Actions variables or secrets."
          exit 1
      - uses: withastro/action@v4
        with:
          node-version: 22
          package-manager: pnpm@12.14.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
